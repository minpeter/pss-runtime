name: Feature request
description: Propose a new capability or enhancement for the runtime or coding agent.
title: "[Feature]: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the feature and
        the problem it solves so maintainers can evaluate it.
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior / feature description
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: textarea
    id: use-case-impact
    attributes:
      label: Use case and impact
      description: >-
        What problem does this solve, who benefits, and what is the impact of
        not having it?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: The success criteria that must hold for this feature to be considered done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, if any.
    validations:
      required: false
