name: OWASP ZAP Baseline

# OWASP ZAP baseline scan (VAL-SEC-034..037). Manual dispatch ONLY: the
# workflow never runs on push, pull_request, or a schedule, and it is a
# distinct file that ci.yml never references, so ordinary PR checks never
# invoke ZAP.
#
# The target is operator-supplied per run via the required target-url
# input. The default is EMPTY - never a loopback address, never any host -
# and an omitted or empty input skips the scan with a visible notice in the
# step log and the run summary.
#
# When a target is supplied the job runs under a bounded timeout
# (timeout-minutes: 20) and the spider is additionally bounded to 5 minutes
# (-m 5). Scan scope: the baseline action feeds only the declared target to
# zap-baseline.py -t, whose generated Automation Framework plan adds just
# the target's host to the scan context, so the spider and the passive scan
# stay constrained to the declared target's host. Issue writing is disabled
# and the job holds contents: read with no other scope, so the scan cannot
# write to the repository.
on:
  workflow_dispatch:
    inputs:
      target-url:
        description: >-
          Full URL (scheme plus host) of the deployed app to baseline-scan,
          e.g. a staging deployment. Never a loopback or local address.
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Skip scan (no target declared)
        if: ${{ inputs.target-url == '' }}
        run: |
          echo "::notice::OWASP ZAP baseline scan skipped - the required target-url input is empty; re-run the workflow with a target URL to scan."
          echo "### ZAP baseline scan skipped - no target-url input was provided" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate public scan target
        id: validate-target
        if: ${{ inputs.target-url != '' }}
        timeout-minutes: 1
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target-url }}
        run: |
          timeout 20s python3 - <<'PY'
          import ipaddress
          import os
          import socket
          import sys
          from urllib.parse import urlsplit

          try:
              target = os.environ["TARGET_URL"]
              if any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in target) or "\\" in target:
                  raise ValueError("URL contains whitespace, control characters, or backslashes")
              url = urlsplit(target)
              if url.scheme not in ("http", "https") or not url.hostname:
                  raise ValueError("target must be an HTTP or HTTPS URL with a host")
              if url.username is not None or url.password is not None:
                  raise ValueError("URL credentials are not allowed")
              host = url.hostname.rstrip(".").lower()
              if not host or "%" in host or host == "localhost" or host.endswith((".localhost", ".local", ".internal")):
                  raise ValueError("local or scoped hosts are not allowed")
              port = url.port if url.port is not None else (443 if url.scheme == "https" else 80)
              if port == 0:
                  raise ValueError("port must be between 1 and 65535")
              addresses = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              if not addresses:
                  raise ValueError("host has no resolved addresses")
              for address in addresses:
                  ip = ipaddress.ip_address(address[4][0])
                  if isinstance(ip, ipaddress.IPv6Address) and ip.ipv4_mapped is not None:
                      ip = ip.ipv4_mapped
                  if not ip.is_global or ip.is_multicast:
                      raise ValueError("target must resolve only to public unicast addresses")
          except (ValueError, OSError) as error:
              print(f"::error::Invalid ZAP target: {error}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: ZAP baseline scan
        if: ${{ inputs.target-url != '' }}
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # Scope: only the operator-declared target URL is ever scanned.
          target: ${{ inputs.target-url }}
          # The job token is read-only, so issue writing stays disabled.
          allow_issue_writing: false
          # Spider bounded to 5 minutes; the generated plan scopes the
          # spider and passive scan to the declared target's host only.
          cmd_options: "-m 5"
