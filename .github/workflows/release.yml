name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate release SHA
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Version and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Validation runs on a separate runner, so recreate and recheck the
      # package artifacts in this runner before Tegami can publish them.
      - name: Build release artifacts
        run: pnpm build

      - name: Verify release artifacts
        run: pnpm verify:release

      - name: Version or publish packages
        run: pnpm tegami ci
        env:
          # npm publish is authenticated by npm Trusted Publishing/OIDC.
          # Configure each package on npm with repository minpeter/pss-runtime
          # and workflow filename release.yml; do not add NPM_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
