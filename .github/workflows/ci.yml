name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # github.workflow is CI for standalone runs and Release for reusable calls.
  # Keep those runs isolated so either can cancel stale work without canceling
  # the release validation for the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Validate (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install sandbox prerequisite
        uses: ./.github/actions/ci-sandbox-prerequisite

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        if: matrix.node == '24'
        run: pnpm run audit

      - name: Check package boundaries
        run: pnpm boundaries

      - name: Validate Pi compatibility manifest
        run: pnpm check:compatibility

      - name: Check tegami entry sections
        run: pnpm check:tegami-notes

      # Workspace shared-dependency drift gate. Deterministic; pinned to
      # Node 24 like the audit/coverage steps so it runs exactly once.
      - name: Check workspace version drift
        if: matrix.node == '24'
        run: pnpm check:workspace-drift --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Knip unused-code gate. Deterministic and fail-closed; pinned to Node 24
      # like the audit/coverage steps.
      - name: Check unused files and exports (Knip)
        if: matrix.node == '24'
        run: pnpm check:unused

      # jscpd duplicate-code gate. Deterministic and fail-closed; pinned to
      # Node 24 like the audit/coverage steps.
      - name: Check duplicate code (jscpd)
        if: matrix.node == '24'
        run: pnpm check:duplicates

      - name: Test
        env:
          PSS_TASK_VALIDATOR_NETWORK_ISOLATED: "1"
        run: pnpm test

  # Keep this as one additional job, rather than sharding every check: the
  # 2m50 Node 24 test and 2m10 coverage gate can overlap while peak runner
  # demand grows only from two runners to three.
  artifacts:
    name: Coverage, build, and release validation (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install sandbox prerequisite
        uses: ./.github/actions/ci-sandbox-prerequisite

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check core package coverage
        run: pnpm coverage

      - name: Check extension package coverage
        run: pnpm coverage:extensions

      - name: Check Worker coverage
        run: pnpm --filter @minpeter/pss-worker-agent test:coverage

      - name: Build
        run: pnpm build

      # Bundle budget gate over the built dist/ artifacts; must run after
      # the Build step (a missing artifact fails the gate).
      - name: Check bundle size budget
        run: pnpm check:bundle-size --check

      - name: Check runtime public API snapshot
        run: pnpm api:check

      - name: Verify release artifacts
        run: pnpm verify:release

      # Test-timing producer (VAL-SEC-024): reruns the deterministic scripts
      # suite and uploads its normalized report as a bounded artifact.
      - name: Produce test-timing report
        run: pnpm test:timing

      - name: Upload test-timing report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing
          path: report/test-timing.json
          retention-days: 7
