packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "experimental/*"
  - "extensions/*"
autoInstallPeers: false
patchedDependencies:
  '@oh-my-pi/hashline@18.1.5': patches/@oh-my-pi__hashline@18.1.5.patch
  '@oh-my-pi/pi-natives@18.1.5': patches/@oh-my-pi__pi-natives@18.1.5.patch
  '@vercel/agent-eval@2.2.1': patches/@vercel__agent-eval@2.2.1.patch
overrides:
  # attw relies on this exact TypeScript build's internal API; do not apply the workspace TypeScript override to it.
  '@arethetypeswrong/core@0.18.5>typescript': 5.6.1-rc
  # Security-only, parent-scoped resolutions where direct updates cannot reach the vulnerable edge.
  # Keep these exact so unrelated consumers retain their declared dependency ranges.
  '@vercel/agent-eval@2.2.1>@ai-sdk/anthropic': 2.0.102
  '@ai-sdk/provider-utils@3.0.37>undici': 6.29.1
  'miniflare@5.20261012.1-beta>undici': 7.30.1
  'dockerode@4.0.12>uuid': 11.1.1
  read-yaml-file: 2.1.0
  typescript: ^7.0.2
  rolldown-plugin-dts: 0.27.2
  vite: 8.1.6
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion: no patched release is published yet, and it
    # is reached only through ultracite's fast-glob/micromatch (lint tooling).
    - GHSA-vfj7-8cjw-p6xm
    # zod <4.6.6 memory exhaustion: zod 3 has no patched release, and zod 3 is
    # reached only through @vercel/agent-eval in the private experimental
    # nextjs-bench, which requires it.
    - GHSA-mrhx-c7xc-m3w5
allowBuilds:
  core-js-pure: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true
# Supply-chain guard: only install versions published at least this many minutes ago.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@minpeter/opensearch@0.1.3'
  - typescript
  - '@typescript/*'
  - rolldown-plugin-dts
