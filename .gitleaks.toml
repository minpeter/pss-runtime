title = "PSS Runtime gitleaks config"

# Extend the built-in gitleaks rule set. Dropping useDefault would replace
# the default rules with nothing, which is a suppression this config never
# makes (VAL-SEC-031).
[extend]
useDefault = true

# Global exclusions only cover exact placeholder assignment lines
# (VAL-SEC-031), never whole files. An unexpected finding must fail the scan,
# never pass silently. Triage instructions live in
# docs/runbooks/security-scan-failure-triage.md.
[allowlist]
description = "Ellipsis placeholder values in example env files"
regexes = [
  # Ellipsis placeholders of the shape NAME=... used in the example env
  # files and docs (e.g. AI_API_KEY=...); a real value never matches.
  '''^[A-Z0-9_]+(API_KEY|TOKEN|SECRET)=\.\.\.$''',
]
# The regex above describes a whole assignment line, not the matched secret.
regexTarget = "line"

# Historical exceptions are rule-specific AND matches of commit, path, and
# exact reviewed non-secret value. See docs/security-scan-history-triage.md.

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Static redacted API-key assertion in security regression test"
condition = "AND"
commits = ["b2ee67c95be1193e0cb0792b80b75f906111ad42"]
paths = ['''^scripts/security\-gitleaks\-history\.test\.mjs$''']
regexTarget = "secret"
regexes = [
  '''^AI_API_KEY=REDACTED$''',
]

[[rules.allowlists]]
description = "Synthetic campaign output-redaction sentinel"
condition = "AND"
commits = ["2710b291e3454d64648ca79696b61f385325be81"]
paths = ['''^benchmarks/compaction\-score/campaign\-aggregation\.test\.ts$''']
regexTarget = "secret"
regexes = [
